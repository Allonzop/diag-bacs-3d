[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Application monopage : toute route inconnue renvoie l'index.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Le service worker et le manifeste ne doivent jamais être servis depuis un cache périmé.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"
